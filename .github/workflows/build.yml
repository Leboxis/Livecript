name: iOS Build
on:
  push:
    branches: [feature/livecript-ios, main]
    paths:
      - 'Livecript/**'
      - 'LivecriptTests/**'
      - 'Livecript.xcodeproj/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Livecript/**'
      - 'LivecriptTests/**'
      - 'Livecript.xcodeproj/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Simulator tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Restore DerivedData cache
        uses: actions/cache@v4
        with:
          path: build
          key: deriveddata-macos26-xcode26.6-${{ hashFiles('Livecript/**/*.swift', 'LivecriptTests/**/*.swift', 'Livecript.xcodeproj/project.pbxproj') }}
          restore-keys: |
            deriveddata-macos26-xcode26.6-
      - name: Simulator tests
        run: bash scripts/ci-test.sh
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Tests.xcresult
          if-no-files-found: warn
  device:
    name: Device build (Release)
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Restore DerivedData cache
        uses: actions/cache@v4
        with:
          path: build
          key: deriveddata-macos26-xcode26.6-${{ hashFiles('Livecript/**/*.swift', 'LivecriptTests/**/*.swift', 'Livecript.xcodeproj/project.pbxproj') }}
          restore-keys: |
            deriveddata-macos26-xcode26.6-
      - name: Device build
        run: xcodebuild -project Livecript.xcodeproj -scheme Livecript -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build